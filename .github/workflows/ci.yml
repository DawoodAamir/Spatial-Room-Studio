name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: swift test && swift test -c release
      - name: Release simulator and device builds
        run: |
          xcodebuild -project 'Spatial Room Studio.xcodeproj' -scheme 'Spatial Room Studio' -configuration Release -destination 'generic/platform=visionOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project 'Spatial Room Studio.xcodeproj' -scheme 'Spatial Room Studio' -configuration Release -destination 'generic/platform=visionOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Ensure visionOS runtime
        run: xcodebuild -downloadPlatform visionOS -buildVersion 27.0 -architectureVariant arm64
      - name: Native workflow
        run: bash Scripts/test-ui.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-workflow
          path: |
            build/Screenshots
            build/*.xcresult
          if-no-files-found: ignore
